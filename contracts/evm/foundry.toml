[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib", "../../node_modules"]
remappings = [
    "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
    "forge-std/=../../lib/forge-std/src/"
]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz = { runs = 256 }
verbosity = 2
