<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriFlow — Agricultural Trade &amp; Logistics Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Hide Google Translate top banner and tooltip overlays without hiding DOM elements */
    iframe.goog-te-banner-frame,
    iframe.skiptranslate,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    .goog-tooltip,
    .goog-tooltip:hover { display: none !important; }
    body { top: 0 !important; position: static !important; }
  </style>
  </head>
  <body class="bg-gray-100/60 text-gray-900 antialiased min-h-screen">
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
    <script>
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,fr,ar,sw,yo,ha,ig,pt,es,zh-TW,hi',
            autoDisplay: false,
          }, 'google_translate_element');
        }
      };
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=2gU5vH2N"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
